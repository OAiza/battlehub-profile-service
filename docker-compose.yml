# Levanta el Profile Service con su base de datos y datos de ejemplo:
#   cp .env.example .env    (y completar los valores)
#   docker compose up --build
# Para borrar todo, incluidos los datos:  docker compose down -v
#
# Orden de arranque: mysql -> migrate -> generar-datos -> api

services:
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
    volumes:
      - profile-mysql-data:/var/lib/mysql
    # El ping va por TCP a 127.0.0.1, como se conectan migrate y la API. Con --host=localhost
    # usaría el socket interno y respondería durante el servidor temporal sin red que la
    # imagen levanta en el primer arranque, y migrate fallaría con "Connection refused".
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --protocol=tcp --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Aplica las migraciones y carga los datos iniciales (permisos y catálogo de juegos).
  # Se ejecuta una vez y termina; la API arranca solo si terminó bien.
  migrate:
    build: .
    image: battlehub-profile-service:local
    command: ["--migrate"]
    environment:
      DatabaseProvider: MySQL
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # Generación de datos (R-28): un proceso aparte, independiente de la API, de las
  # migraciones y del seed. Ejecuta docker/datos/generar-datos.sql con el cliente de MySQL
  # cuando las migraciones terminaron; luego termina.
  generar-datos:
    image: mysql:8.4.9
    environment:
      # MYSQL_PWD evita escribir la contraseña en la línea de comandos.
      MYSQL_PWD: ${MYSQL_PASSWORD}
      DATOS_USUARIO: ${MYSQL_USER}
      DATOS_BASE: ${MYSQL_DATABASE}
    volumes:
      - ./docker/datos:/datos:ro
    entrypoint: ["sh", "-c", "mysql --host=mysql --user=\"$$DATOS_USUARIO\" \"$$DATOS_BASE\" < /datos/generar-datos.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    image: battlehub-profile-service:local
    environment:
      DatabaseProvider: MySQL
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
      Auth0__Domain: ${AUTH0_DOMAIN:?Defina AUTH0_DOMAIN en .env}
      Auth0__Audience: ${AUTH0_AUDIENCE:?Defina AUTH0_AUDIENCE en .env}
      Auth0__Management__ClientId: ${AUTH0_MGMT_CLIENT_ID:-}
      Auth0__Management__ClientSecret: ${AUTH0_MGMT_CLIENT_SECRET:-}
      Auth0__Management__Audience: ${AUTH0_MGMT_AUDIENCE:-}
      # Identifier de la API de cada juego en Auth0 (R-09): sin ellos la API no arranca.
      Auth0__PermissionApis__Typing: ${AUTH0_API_TYPING:?Defina AUTH0_API_TYPING en .env}
      Auth0__PermissionApis__Trivia: ${AUTH0_API_TRIVIA:?Defina AUTH0_API_TRIVIA en .env}
      Auth0__PermissionApis__Memory: ${AUTH0_API_MEMORY:?Defina AUTH0_API_MEMORY en .env}
      Auth0__PermissionApis__Matchmaking: ${AUTH0_API_MATCHMAKING:-}
      Cors__Origins__0: ${CORS_ORIGIN:?Defina CORS_ORIGIN en .env}
      Cors__Origins__1: ${CORS_ORIGIN_PUBLISHED:-}
      # El contenedor solo escucha HTTP: sin redirección para no romper el CORS del Shell.
      Https__Redirect: ${HTTPS_REDIRECT:-false}
    ports:
      - "${PROFILE_API_PORT:-5220}:8080"
    depends_on:
      generar-datos:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  profile-mysql-data:
