name: Profile Service CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test
          tests/BattleHub.ProfileService.UnitTests/BattleHub.ProfileService.UnitTests.csproj
          --configuration Release
          --no-build

      - name: Run integration tests
        run: >
          dotnet test
          tests/BattleHub.ProfileService.IntegrationTests/BattleHub.ProfileService.IntegrationTests.csproj
          --configuration Release
          --no-build