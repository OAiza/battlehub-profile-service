name: Profile Service CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      # Cobertura mínima de líneas del código de la API (sin migraciones ni código generado).
      COVERAGE_MIN: 85

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test
          tests/BattleHub.ProfileService.UnitTests/BattleHub.ProfileService.UnitTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage/raw

      # Incluye las pruebas contra MySQL real, que levantan un contenedor con Testcontainers.
      - name: Run integration tests
        run: >
          dotnet test
          tests/BattleHub.ProfileService.IntegrationTests/BattleHub.ProfileService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage/raw

      - name: Coverage report
        run: >
          dotnet reportgenerator
          "-reports:coverage/raw/**/coverage.cobertura.xml"
          "-targetdir:coverage/report"
          "-reporttypes:TextSummary;MarkdownSummaryGithub"
          "-assemblyfilters:+BattleHub.ProfileService.Api"
          "-filefilters:-*/Migrations/*;-*/obj/*"

      - name: Check minimum coverage
        run: |
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          coverage=$(grep --perl-regexp --only-matching 'Line coverage: \K[0-9.]+' coverage/report/Summary.txt)
          echo "Cobertura de líneas: ${coverage}% (mínimo: ${COVERAGE_MIN}%)"
          if awk -v actual="$coverage" -v min="$COVERAGE_MIN" 'BEGIN { exit !(actual >= min) }'; then
            echo "Cobertura suficiente."
          else
            echo "::error::La cobertura de líneas (${coverage}%) es menor al mínimo de ${COVERAGE_MIN}%."
            exit 1
          fi

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # El CI no usa secretos: los valores de ejemplo bastan para probar el arranque.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --tag battlehub-profile-service:ci .

      - name: Start MySQL, migration and API
        run: docker compose up --detach --build

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5220/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "La API no respondió en /health"
          exit 1

      - name: Check migration and initial data
        run: |
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet migrate)")
          test "$exit_code" = "0"
          games=$(docker compose exec -T mysql sh -c 'mysql --user="$MYSQL_USER" --password="$MYSQL_PASSWORD" --database="$MYSQL_DATABASE" --skip-column-names --execute="SELECT COUNT(*) FROM games;"')
          echo "Juegos cargados: $games"
          test "$games" = "3"

      - name: Protected endpoint without token returns 401
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:5220/api/profiles/me)
          echo "GET /api/profiles/me sin token: $status"
          test "$status" = "401"

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop and remove containers and data
        if: always()
        run: docker compose down --volumes